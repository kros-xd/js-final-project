<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player | Final Project</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div id="wrapper">
        <div class="music-player-container">
            <div id="album-screen">
                <img src="assets/svgs/music-player-song-svgrepo-com.svg" alt="placeholder image">
            </div>
            <div id="controls">
                <div id="song-title-container">
                    <audio src="assets/audio/beabadoobee - 'Cologne'.mp3"></audio>
                    <h1>
                        Nothing is playing
                    </h1>
                </div>
                <div class="music-btns">
                    <div id="minus-volume-btn">
                        <img src="assets/svgs/darkMinusBtn.svg" alt="Decrement volume button">
                    </div>
                    <div>
                        <input id="volume-slider" type="range" min="0" max="100" value="50">
                    </div>
                    <div id="add-volume-btn">
                        <img src="assets/svgs/darkPlusBtn.svg" alt="Increment volume button">
                    </div>
                </div>
                <div class="music-btns">
                    <div id="previous-btn">
                        <img src="assets/svgs/darkPreviousBtn.svg" alt="Previous button">
                    </div>
                    <div id="play-stop-btn">
                        <img src="assets/svgs/darkPlayBtn.svg" alt="Play button">
                    </div>
                    <div id="skip-btn">
                        <img src="assets/svgs/darkSkipBtn.svg" alt="Skip button">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
