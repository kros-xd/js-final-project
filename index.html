<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player | Final Project</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>
    <div id="wrapper">
        <div class="music-player-container">
            <div id="album-screen">
                <img id="temp-image" src="assets/svgs/music-player-song-svgrepo-com.svg" alt="placeholder image">
            </div>
            <div id="controls">
                <div id="song-title-container">
                    <audio src="assets/audio/Ax and the Hatchetmen- MAKO.mp3"></audio>
                    <h1 id="song-desc">
                        Nothing is playing
                    </h1>
                </div>
                <div class="music-btns">
                    <div id="minus-volume-btn">
                        <img src="assets/svgs/darkMinusBtn.svg" alt="Decrement volume button">
                    </div>
                    <div>
                        <input id="volume-slider" type="range" min="0" max="1" step="0.01">
                    </div>
                    <div id="add-volume-btn">
                        <img src="assets/svgs/darkPlusBtn.svg" alt="Increment volume button">
                    </div>
                </div>
                <div class="music-btns">
                    <div id="previous-btn">
                        <img src="assets/svgs/darkPreviousBtn.svg" alt="Previous button">
                    </div>
                    <div id="play-stop-btn">
                        <img id="playback-handler" src="assets/svgs/darkPlayBtn.svg" alt="Play button">
                    </div>
                    <div id="skip-btn">
                        <img src="assets/svgs/darkSkipBtn.svg" alt="Skip button">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<!--
I chose a music player web app, because I really enjoy music! 
I used to do music composition & scoring full time, but decided to do a career transition.
Anyway, the songs listed are some of my favorites that I wanted to share.
The way I structured this HTML file was by separating my music player into 3 Major components:
|- Music Player Container: holds the album screen, controls, song title, and playback buttons.
|- Album Screen: Changes to the album cover of a song at the current index.
    |- Temp Image: Uses a default SVG image placeholder when nothing is playing.
|- Controls: I made a container for controls so that I can manipulate the layout using flex.
    |- Song title container:
        |- Audio for music
        |- Song title that changes based on current index.
    |- Music Btns container x2:
        |- Music Btns 1: holds volume controls
            |- Increment, Decrement buttons, and a range input to manually control sound.
        |- Music Btns 2: holds playback controls
            |- Previous, Start / Stop, and Skip.
-->
